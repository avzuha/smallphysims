<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Electric Field Simulation</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin:0;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0A1123, #3A3E6C, #8387C3);
    color:white;
    text-align:center;
    min-height: 100vh;
    overflow-x: hidden;
}

h2 {
    margin:25px;
    font-weight: 400;
}

.controls {
    margin:20px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

.controls input {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    color: white;
    padding: 8px 15px;
    font-size: 1rem;
    outline: none;
    width: 110px;
    transition: all 0.3s ease;
}

.controls input:focus {
    background: rgba(255, 255, 255, 0.2);
    border-color: #CEB5D4;
    box-shadow: 0 0 8px rgba(206, 181, 212, 0.4);
}

.container {
    display:flex;
    justify-content:center;
    gap:30px;
    margin-top:20px;
    padding-bottom: 80px;
}

.card {
    background: rgba(255, 255, 255, 0.05);
    padding:15px;
    border-radius:20px;
    width:420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(5px);
}

canvas {
    border-radius:12px;
}

#sphereCanvas, #graphCanvas {
    background-color: rgba(0, 0, 0, 0.2);
    background-image:
        linear-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
    background-size: 40px 40px;
}

#output {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 18px 0;
    background: rgba(10, 17, 35, 0.9);
    backdrop-filter: blur(15px);
    font-size: 1.1rem;
    text-align: center;
    box-sizing: border-box;
    z-index: 100;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
}
</style>
</head>

<body>

<h2>Electric Field of Charged Sphere (Uniform, Non-Conducting)</h2>

<div class="controls">
    R: <input id="radius" value="1">
    q: <input id="charge" value="1e-6">
</div>

<div class="container">
    <div class="card">
        <canvas id="sphereCanvas" width="400" height="400"></canvas>
    </div>
    <div class="card">
        <canvas id="graphCanvas" width="400" height="400"></canvas>
    </div>
</div>

<div id="output">Click on the sphere to begin...</div>

<script>
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext("2d");

let chart, graphData;
let lastPoint = null;

const SCALE = 100;
const FIXED_POINTS = [[0,0], [1,0], [-1,0], [0,1], [0,-1]];

function drawSphere(){
    ctx.clearRect(0,0,400,400);

    // 1. Draw Sphere FIRST (Bottom layer)
    ctx.beginPath();
    ctx.arc(200,200,100,0,2*Math.PI);
    ctx.fillStyle="#4E7AB1";
    ctx.fill();

    // 2. Draw Axis lines SECOND (Middle layer - now on top of sphere)
    ctx.strokeStyle="rgba(255,255,255,0.2)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,200); ctx.lineTo(400,200); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(200,0); ctx.lineTo(200,400); ctx.stroke();

    // 3. Draw Points LAST (Top layer)
    ctx.fillStyle="rgba(206,181,212,0.4)";
    FIXED_POINTS.forEach(p=>{
        ctx.beginPath();
        ctx.arc(200 + p[0]*SCALE, 200 - p[1]*SCALE, 5, 0, 2*Math.PI);
        ctx.fill();
    });

    if(lastPoint){
        ctx.fillStyle="white";
        ctx.beginPath();
        ctx.arc(200 + lastPoint.x*SCALE, 200 - lastPoint.y*SCALE, 6, 0, 2*Math.PI);
        ctx.fill();
    }
}

canvas.onclick = async e => {
    let rect = canvas.getBoundingClientRect();
    let cx = e.clientX - rect.left;
    let cy = e.clientY - rect.top;
    let R = parseFloat(document.getElementById('radius').value);
    let q = parseFloat(document.getElementById('charge').value);
    let realX = (cx - 200) / SCALE;
    let realY = (200 - cy) / SCALE;

    const snapThreshold = 0.1;
    for (let p of FIXED_POINTS) {
        let dist = Math.sqrt(Math.pow(p[0] - realX, 2) + Math.pow(p[1] - realY, 2));
        if (dist < snapThreshold) {
            realX = p[0]; realY = p[1]; break;
        }
    }
    lastPoint = {x: realX, y: realY};
    try {
        let res = await fetch("/calculate", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({x: realX, y: realY, R, q})
        });
        let d = await res.json();
        document.getElementById('output').innerText = `x=${d.x} m, y=${d.y} m → r=${d.r} m | E=${d.E} N/C`;
    } catch (err) {
        document.getElementById('output').innerText = `x=${realX.toFixed(2)} m, y=${realY.toFixed(2)} m → r=calc m | E=calc N/C`;
    }
    drawSphere();
};

async function updateGraph(){
    let R = parseFloat(document.getElementById('radius').value);
    let q = parseFloat(document.getElementById('charge').value);

    try {
        let res = await fetch("/graph", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({R, q})
        });
        graphData = await res.json();
    } catch (err) {
        graphData = { r: [0, 0.5, 1, 1.5, 2], E: [0, 500, 1000, 600, 300] };
    }

    const plotPoints = graphData.r.map((val, i) => ({ x: parseFloat(val), y: graphData.E[i] }));

    if(chart) chart.destroy();

    chart = new Chart(document.getElementById('graphCanvas'), {
        type: "line",
        data: {
            datasets: [{
                label: "Electric Field (E)",
                data: plotPoints,
                borderColor: "#CEB5D4",
                backgroundColor: "rgba(206, 181, 212, 0.1)",
                pointRadius: 0,
                borderWidth: 3,
                tension: 0.2
            }]
        },
        options: {
            responsive: false,
            maintainAspectRatio: false,
            scales: {
                x: {
                    type: 'linear',
                    grid: { display: false },
                    title: { display: true, text: "r (m)", color: "white" },
                    ticks: { color: "white" },
                    min: 0,
                    max: Math.max(...graphData.r)
                },
                y: {
                    beginAtZero: true,
                    grid: { display: false },
                    title: { display: true, text: "E (N/C)", color: "white" },
                    ticks: { color: "white" }
                }
            },
            plugins: {
                legend: { labels: { color: 'white' } }
            }
        }
    });
}

document.getElementById('radius').oninput = updateGraph;
document.getElementById('charge').oninput = updateGraph;

drawSphere();
updateGraph();
</script>

</body>
</html>
